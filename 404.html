<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page introuvable | AgentsAutonomes.ai</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0d0f12; --surface: #151820; --border: #1e2230; --accent: #00e5a0; --accent-dim: rgba(0,229,160,0.12); --text: #e8eaf0; --muted: #6b7080; --heading: #ffffff; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 17px; line-height: 1.75; min-height: 100vh; }
    header { border-bottom: 1px solid var(--border); padding: 1.25rem 2rem; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.1rem; color: var(--accent); text-decoration: none; }
    .logo span { color: var(--heading); }
    nav a { color: var(--muted); text-decoration: none; font-size: 0.9rem; margin-left: 2rem; }
    .hero { max-width: 760px; margin: 6rem auto 0; padding: 0 2rem; text-align: center; }
    .tag { display: inline-block; background: var(--accent-dim); color: var(--accent); font-size: 0.75rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.3rem 0.75rem; border-radius: 2px; margin-bottom: 1.5rem; }
    h1 { font-family: 'Syne', sans-serif; font-size: clamp(2.2rem, 6vw, 3.5rem); font-weight: 800; color: var(--heading); line-height: 1.1; letter-spacing: -0.03em; margin-bottom: 1.5rem; }
    h1 span { color: var(--accent); }
    .subtitle { font-size: 1.15rem; color: var(--muted); max-width: 540px; margin: 0 auto 3rem; }
    .value-props { max-width: 760px; margin: 0 auto; padding: 0 2rem 4rem; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    .prop { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 1.5rem; }
    .prop-icon { font-size: 1.5rem; margin-bottom: 0.75rem; }
    .prop h3 { font-family: 'Syne', sans-serif; font-weight: 700; color: var(--heading); font-size: 1rem; margin-bottom: 0.5rem; }
    .prop p { font-size: 0.9rem; color: var(--muted); margin: 0; }
    .newsletter-block { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 2.5rem; max-width: 540px; margin: 0 auto 5rem; }
    .newsletter-block h2 { font-family: 'Syne', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--heading); margin-bottom: 0.5rem; }
    .newsletter-block p { color: var(--muted); font-size: 0.95rem; margin-bottom: 1.5rem; }
    .sib-form { background: transparent !important; padding: 0 !important; }
    #sib-container { background: transparent !important; border: none !important; max-width: 100% !important; padding: 0 !important; }
    #sib-form-container { padding: 0 !important; }
    .entry__label { display: none !important; }
    .entry__specification { display: none !important; }
.sib-form-block { display: block !important; }
    .input { width: 100%; padding: 0.85rem 1rem; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: 1rem; margin-bottom: 0.75rem; font-family: 'Inter', sans-serif; }
    .input:focus { outline: none; border-color: var(--accent); }
    .input::placeholder { color: var(--muted); }
    .sib-form-block__button { width: 100%; background: var(--accent) !important; color: #0d0f12 !important; font-family: 'Syne', sans-serif !important; font-size: 1rem !important; font-weight: 700 !important; padding: 0.9rem !important; border-radius: 4px !important; cursor: pointer; border: none !important; }
    .articles { max-width: 760px; margin: 0 auto; padding: 0 2rem 6rem; }
    .articles h2 { font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 700; color: var(--heading); margin-bottom: 0.5rem; }
    .batch-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 1.5rem; text-transform: uppercase; letter-spacing: 0.08em; }
    .article-list { display: flex; flex-direction: column; gap: 1px; background: var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 2rem; }
    .article-item { background: var(--surface); padding: 1.25rem 1.5rem; display: flex; align-items: center; justify-content: space-between; text-decoration: none; transition: background 0.2s; gap: 1rem; }
    .article-item:hover { background: #1a1f2e; }
    .article-title { font-family: 'Syne', sans-serif; font-weight: 600; color: var(--heading); font-size: 0.95rem; }
    .article-arrow { color: var(--accent); font-size: 1.2rem; flex-shrink: 0; }
    footer { border-top: 1px solid var(--border); padding: 2rem; text-align: center; color: var(--muted); font-size: 0.8rem; }
    @media (max-width: 640px) { nav { display: none; } .hero, .articles { padding-left: 1.25rem; padding-right: 1.25rem; } .value-props { grid-template-columns: 1fr; padding-left: 1.25rem; padding-right: 1.25rem; } .newsletter-block { margin-left: 1.25rem; margin-right: 1.25rem; } }
  
    .theme { font-family: 'Syne', sans-serif; font-size: 1.15rem; font-weight: 700; color: var(--heading); margin: 2.5rem 0 1rem; }
    .page-hero { max-width: 760px; margin: 4rem auto 2rem; padding: 0 2rem; }
    .page-hero h1 { font-family: 'Syne', sans-serif; font-size: clamp(1.8rem, 4.5vw, 2.5rem); font-weight: 800; color: var(--heading); line-height: 1.15; letter-spacing: -0.03em; margin-bottom: 1rem; }
  </style>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
</head>
<body>
<header>
  <a href="/" class="logo">agents<span>autonomes</span>.ai</a>
  <nav><a href="/">Accueil</a><a href="/articles">Tous les articles</a></nav>
</header>
<div class="page-hero">
  <h1>Page introuvable</h1>
  <p class="subtitle" style="color:var(--muted)">Cette page n'existe pas ou a changé d'adresse. Retrouvez nos articles sur <a href="/articles" style="color:var(--accent)">la page Tous les articles</a> ou revenez à <a href="/" style="color:var(--accent)">l'accueil</a>.</p>
</div>
</body>
</html>
